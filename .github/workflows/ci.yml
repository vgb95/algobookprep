name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check & build
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: algobook-dist
          path: dist
          retention-days: 7
